services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      AI_SERVICE_URL: http://ai:8000
      ML_SERVICE_URL: http://ml:8001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/groundguard
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - ai
      - ml
      - postgres
      - redis

  ai:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ai
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/groundguard
      QDRANT_URL: http://qdrant:6333
      TANTIVY_PATH: /app/uploads/indexes/tantivy
      GRAPHS_PATH: /app/uploads/graphs
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - qdrant

  ml:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ml
    ports:
      - "8001:8001"
    environment:
      PORT: 8001

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: groundguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  qdrant_data:
