name: Build Container Images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-images:
    name: Build Production Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: groundguard/api:${{ github.sha }}

      - name: Build AI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.ai
          push: false
          tags: groundguard/ai:${{ github.sha }}

      - name: Build ML Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.ml
          push: false
          tags: groundguard/ml:${{ github.sha }}

      - name: Build Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: groundguard/web:${{ github.sha }}
